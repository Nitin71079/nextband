<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="520" fill="#f2f4f8" rx="6"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">HARWOOD COMMUNITY LIBRARY – FLOOR PLAN</text>

  <!-- Compass -->
  <text x="686" y="44" font-size="11" fill="#444" font-weight="bold">N</text>
  <line x1="692" y1="48" x2="692" y2="66" stroke="#444" stroke-width="1.5"/>
  <polygon points="692,38 688,50 696,50" fill="#444"/>

  <!-- ══════════════════════════════════════
       OUTER BUILDING WALL
  ══════════════════════════════════════ -->
  <rect x="50" y="42" width="620" height="420" fill="#ffffff" stroke="#444" stroke-width="3" rx="4"/>

  <!-- MAIN ENTRANCE — south side -->
  <rect x="310" y="440" width="100" height="22" fill="#c8ddf8" stroke="#4a6888" stroke-width="2"/>
  <text x="360" y="456" text-anchor="middle" font-size="10" fill="#2a4868" font-weight="bold">MAIN ENTRANCE</text>

  <!-- Central hallway running north–south -->
  <rect x="290" y="42" width="140" height="420" fill="#ececec" stroke="#bbb" stroke-width="1"/>
  <text x="360" y="260" text-anchor="middle" font-size="10" fill="#888" font-style="italic" transform="rotate(-90,360,260)">Main Corridor</text>

  <!-- ══════════════════════════════════════
       WEST WING (left of corridor)
  ══════════════════════════════════════ -->

  <!-- RETURNS DESK — Q19=G — north-west, near entrance corridor junction -->
  <rect x="50" y="340" width="240" height="80" fill="#fce8e8" stroke="#a03030" stroke-width="2" rx="2"/>
  <text x="170" y="378" text-anchor="middle" font-size="12" fill="#6a1010" font-weight="bold">19</text>
  <circle cx="170" cy="375" r="14" fill="none" stroke="#6a1010" stroke-width="2"/>
  <text x="170" y="412" text-anchor="middle" font-size="9" fill="#888" font-style="italic">(label here)</text>

  <!-- FICTION COLLECTION — D — south-west area (named, not numbered) -->
  <rect x="50" y="42" width="240" height="130" fill="#f0f8ff" stroke="#3060a0" stroke-width="1.5" rx="0" stroke-dasharray="5,3"/>
  <text x="170" y="98" text-anchor="middle" font-size="11" fill="#1a3870" font-weight="bold">Fiction Collection</text>
  <text x="170" y="115" text-anchor="middle" font-size="10" fill="#888">(D)</text>
  <!-- Book icon -->
  <rect x="157" y="128" width="10" height="14" fill="none" stroke="#3060a0" stroke-width="1.2" rx="1"/>
  <rect x="170" y="128" width="10" height="14" fill="none" stroke="#3060a0" stroke-width="1.2" rx="1"/>
  <rect x="183" y="128" width="10" height="14" fill="none" stroke="#3060a0" stroke-width="1.2" rx="1"/>

  <!-- QUIET READING ROOM — Q18=F — mid-west -->
  <rect x="50" y="172" width="240" height="100" fill="#f0ffe8" stroke="#208040" stroke-width="2" rx="2"/>
  <text x="170" y="214" text-anchor="middle" font-size="12" fill="#0a4820" font-weight="bold">18</text>
  <circle cx="170" cy="211" r="14" fill="none" stroke="#0a4820" stroke-width="2"/>
  <text x="170" y="252" text-anchor="middle" font-size="9" fill="#888" font-style="italic">(label here)</text>
  <!-- Silence symbol -->
  <text x="170" y="272" text-anchor="middle" font-size="12" fill="#208040">🤫</text>

  <!-- COMMUNITY NOTICE BOARD — B — in corridor junction (named) -->
  <rect x="50" y="272" width="240" height="68" fill="#fffbe0" stroke="#b09030" stroke-width="1.5" rx="0" stroke-dasharray="5,3"/>
  <text x="170" y="302" text-anchor="middle" font-size="10" fill="#705010" font-weight="bold">Community Notice Board</text>
  <text x="170" y="318" text-anchor="middle" font-size="9" fill="#888">(B)</text>

  <!-- ══════════════════════════════════════
       EAST WING (right of corridor)
  ══════════════════════════════════════ -->

  <!-- DIGITAL RESOURCE SUITE — Q16=C — north-east -->
  <rect x="430" y="42" width="240" height="130" fill="#e8e8ff" stroke="#5030b0" stroke-width="2" rx="2"/>
  <text x="550" y="96" text-anchor="middle" font-size="12" fill="#301878" font-weight="bold">16</text>
  <circle cx="550" cy="93" r="14" fill="none" stroke="#301878" stroke-width="2"/>
  <text x="550" y="128" text-anchor="middle" font-size="9" fill="#888" font-style="italic">(label here)</text>
  <!-- Computer icon -->
  <rect x="538" y="140" width="24" height="16" fill="none" stroke="#5030b0" stroke-width="1.2" rx="2"/>
  <line x1="550" y1="156" x2="550" y2="163" stroke="#5030b0" stroke-width="1.2"/>
  <line x1="543" y1="163" x2="557" y2="163" stroke="#5030b0" stroke-width="1.2"/>

  <!-- CHILDREN'S CORNER — Q17=A — mid-east -->
  <rect x="430" y="172" width="240" height="100" fill="#fff8e0" stroke="#b07820" stroke-width="2" rx="2"/>
  <text x="550" y="214" text-anchor="middle" font-size="12" fill="#6a4210" font-weight="bold">17</text>
  <circle cx="550" cy="211" r="14" fill="none" stroke="#6a4210" stroke-width="2"/>
  <text x="550" y="252" text-anchor="middle" font-size="9" fill="#888" font-style="italic">(label here)</text>
  <!-- Star / play icon -->
  <text x="550" y="272" text-anchor="middle" font-size="14" fill="#b07820">⭐</text>

  <!-- LOCAL HISTORY ARCHIVE — Q20=E — south-east -->
  <rect x="430" y="272" width="240" height="148" fill="#f5ede0" stroke="#905020" stroke-width="2" rx="2"/>
  <text x="550" y="346" text-anchor="middle" font-size="12" fill="#5a2808" font-weight="bold">20</text>
  <circle cx="550" cy="343" r="14" fill="none" stroke="#5a2808" stroke-width="2"/>
  <text x="550" y="378" text-anchor="middle" font-size="9" fill="#888" font-style="italic">(label here)</text>
  <!-- Scroll icon -->
  <ellipse cx="550" cy="400" rx="12" ry="6" fill="none" stroke="#905020" stroke-width="1.5"/>
  <rect x="538" y="394" width="24" height="14" fill="none" stroke="#905020" stroke-width="1.2" rx="1"/>

  <!-- STUDY PODS — H — named location in corridor area -->
  <rect x="300" y="320" width="120" height="80" fill="#f8f8f8" stroke="#707070" stroke-width="1.5" rx="0" stroke-dasharray="5,3"/>
  <text x="360" y="355" text-anchor="middle" font-size="10" fill="#404040" font-weight="bold">Study Pods</text>
  <text x="360" y="370" text-anchor="middle" font-size="9" fill="#888">(H)</text>

  <!-- ══════════════════════════════════════
       DOOR MARKS
  ══════════════════════════════════════ -->
  <line x1="290" y1="172" x2="290" y2="272" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="430" y1="172" x2="430" y2="272" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Door west rooms -->
  <rect x="283" y="198" width="7" height="20" fill="#b0b0b0" stroke="#888" stroke-width="1"/>
  <rect x="283" y="352" width="7" height="20" fill="#b0b0b0" stroke="#888" stroke-width="1"/>

  <!-- Door east rooms -->
  <rect x="430" y="88" width="7" height="20" fill="#b0b0b0" stroke="#888" stroke-width="1"/>
  <rect x="430" y="218" width="7" height="20" fill="#b0b0b0" stroke="#888" stroke-width="1"/>
  <rect x="430" y="320" width="7" height="20" fill="#b0b0b0" stroke="#888" stroke-width="1"/>

  <!-- ══════════════════════════════════════
       LEGEND
  ══════════════════════════════════════ -->
  <rect x="50" y="474" width="620" height="38" fill="#f8f8f8" stroke="#ddd" stroke-width="1" rx="4"/>
  <line x1="68" y1="490" x2="108" y2="490" stroke="#555" stroke-width="2"/>
  <text x="115" y="494" font-size="10" fill="#444">= numbered question location</text>
  <line x1="260" y1="490" x2="300" y2="490" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="307" y="494" font-size="10" fill="#888">= named reference (not a question)</text>
  <text x="550" y="494" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">Not to scale</text>

</svg>
