<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="700" height="520" fill="#f5f0e8" rx="6"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">HARTLEY CITY MUSEUM – GROUND FLOOR PLAN</text>

  <!-- Outer museum walls -->
  <rect x="60" y="50" width="580" height="440" fill="#fff" stroke="#444" stroke-width="2.5" rx="3"/>

  <!-- Compass / North indicator -->
  <text x="652" y="70" font-size="11" fill="#555" font-weight="bold">N</text>
  <line x1="658" y1="73" x2="658" y2="90" stroke="#555" stroke-width="1.5"/>
  <polygon points="658,60 654,73 662,73" fill="#555"/>

  <!-- ─── ROOMS ─── -->

  <!-- Main Entrance Hall (centre-bottom) -->
  <rect x="230" y="380" width="240" height="100" fill="#e8e0d0" stroke="#666" stroke-width="1.5"/>
  <text x="350" y="425" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Main</text>
  <text x="350" y="441" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Entrance Hall</text>
  <!-- Entrance door at bottom -->
  <rect x="315" y="478" width="70" height="12" fill="#c9b99a" stroke="#888" stroke-width="1"/>
  <text x="350" y="489" text-anchor="middle" font-size="10" fill="#555">ENTRANCE</text>

  <!-- Room 16 – top-left (Cloakroom = E) -->
  <rect x="60" y="50" width="160" height="120" fill="#dce8f0" stroke="#666" stroke-width="1.5"/>
  <text x="140" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">16</text>
  <circle cx="140" cy="100" r="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="130" text-anchor="middle" font-size="10" fill="#666" font-style="italic">(label here)</text>

  <!-- Room 17 – top-centre-left (Egyptian Exhibition = D) -->
  <rect x="220" y="50" width="160" height="120" fill="#f0e8d0" stroke="#666" stroke-width="1.5"/>
  <text x="300" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">17</text>
  <circle cx="300" cy="100" r="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="130" text-anchor="middle" font-size="10" fill="#666" font-style="italic">(label here)</text>

  <!-- Room 18 – top-right (Photography Exhibition = G) -->
  <rect x="380" y="50" width="260" height="120" fill="#f0d8d8" stroke="#666" stroke-width="1.5"/>
  <text x="510" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">18</text>
  <circle cx="510" cy="100" r="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="510" y="130" text-anchor="middle" font-size="10" fill="#666" font-style="italic">(label here)</text>

  <!-- Room 19 – middle-left (Children's Workshop = F) -->
  <rect x="60" y="200" width="200" height="150" fill="#e0f0e0" stroke="#666" stroke-width="1.5"/>
  <text x="160" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">19</text>
  <circle cx="160" cy="270" r="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="160" y="300" text-anchor="middle" font-size="10" fill="#666" font-style="italic">(label here)</text>

  <!-- Room 20 – middle-right (Café = B) -->
  <rect x="460" y="200" width="180" height="150" fill="#fdf0d0" stroke="#666" stroke-width="1.5"/>
  <text x="550" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">20</text>
  <circle cx="550" cy="270" r="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="550" y="300" text-anchor="middle" font-size="10" fill="#666" font-style="italic">(label here)</text>

  <!-- Central corridor / courtyard area -->
  <rect x="260" y="200" width="200" height="150" fill="#e8e8e8" stroke="#aaa" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="360" y="265" text-anchor="middle" font-size="11" fill="#888">Central</text>
  <text x="360" y="281" text-anchor="middle" font-size="11" fill="#888">Atrium</text>

  <!-- Gift Shop – lower-left (already named, not a numbered answer) -->
  <rect x="60" y="375" width="165" height="115" fill="#ede0f5" stroke="#666" stroke-width="1.5"/>
  <text x="143" y="428" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Gift Shop</text>
  <text x="143" y="448" text-anchor="middle" font-size="10" fill="#666">(A)</text>

  <!-- Lecture Theatre – lower-right (already named, not a numbered answer) -->
  <rect x="475" y="375" width="165" height="115" fill="#e0eef5" stroke="#666" stroke-width="1.5"/>
  <text x="558" y="428" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Lecture Theatre</text>
  <text x="558" y="448" text-anchor="middle" font-size="10" fill="#666">(C)</text>

  <!-- Internal doors / corridors -->
  <!-- Top rooms to atrium -->
  <line x1="220" y1="170" x2="220" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="380" y1="170" x2="380" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Side rooms to atrium -->
  <line x1="260" y1="275" x2="260" y2="275" stroke="#999" stroke-width="1"/>
  <line x1="460" y1="275" x2="460" y2="275" stroke="#999" stroke-width="1"/>
  <!-- Atrium to entrance hall -->
  <line x1="350" y1="350" x2="350" y2="380" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Staircase symbol (top-right corner of atrium) -->
  <g transform="translate(432,205)">
    <rect x="0" y="0" width="22" height="18" fill="#ccc" stroke="#888" stroke-width="1"/>
    <line x1="0" y1="6" x2="22" y2="6" stroke="#888" stroke-width="0.8"/>
    <line x1="0" y1="12" x2="22" y2="12" stroke="#888" stroke-width="0.8"/>
    <text x="11" y="26" text-anchor="middle" font-size="8" fill="#666">stairs</text>
  </g>

  <!-- Lift symbol -->
  <rect x="265" y="352" width="18" height="18" fill="#bcd" stroke="#789" stroke-width="1"/>
  <text x="274" y="364" text-anchor="middle" font-size="8" fill="#456">lift</text>

  <!-- Directional labels on corridors -->
  <text x="350" y="362" text-anchor="middle" font-size="9" fill="#aaa">▼</text>

  <!-- Scale bar -->
  <line x1="80" y1="505" x2="180" y2="505" stroke="#555" stroke-width="1.5"/>
  <line x1="80" y1="500" x2="80" y2="510" stroke="#555" stroke-width="1.5"/>
  <line x1="180" y1="500" x2="180" y2="510" stroke="#555" stroke-width="1.5"/>
  <text x="130" y="518" text-anchor="middle" font-size="10" fill="#555">10 metres</text>

  <!-- Legend note -->
  <text x="350" y="512" text-anchor="middle" font-size="10" fill="#888" font-style="italic">Not to scale – for reference only</text>

</svg>
