<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="700" height="540" fill="#eef5e8" rx="6"/>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">GREEN VALLEY WILDLIFE RESCUE CENTRE – SITE MAP</text>

  <!-- Outer boundary fence -->
  <rect x="50" y="45" width="600" height="465" fill="#f7fbf2" stroke="#5a7a4a" stroke-width="2.5" stroke-dasharray="8,4" rx="4"/>

  <!-- Compass / North indicator -->
  <text x="642" y="68" font-size="11" fill="#444" font-weight="bold">N</text>
  <line x1="648" y1="72" x2="648" y2="90" stroke="#444" stroke-width="1.5"/>
  <polygon points="648,60 644,72 652,72" fill="#444"/>

  <!-- ══════════════════════════════
       PATHS / ROADS
  ══════════════════════════════ -->

  <!-- Main path from entrance (south) going north to circular lawn -->
  <line x1="350" y1="490" x2="350" y2="310" stroke="#c8b880" stroke-width="10" stroke-linecap="round"/>

  <!-- East path from circular lawn to Vet Clinic and Food Prep -->
  <line x1="400" y1="310" x2="590" y2="310" stroke="#c8b880" stroke-width="8" stroke-linecap="round"/>

  <!-- Left path from circular lawn past picnic area to Bird Rehab -->
  <line x1="300" y1="270" x2="140" y2="170" stroke="#c8b880" stroke-width="8" stroke-linecap="round"/>

  <!-- Path label -->
  <text x="350" y="455" text-anchor="middle" font-size="9" fill="#9a8a50" font-style="italic">Main Path</text>
  <text x="510" y="302" text-anchor="middle" font-size="9" fill="#9a8a50" font-style="italic">East Path</text>

  <!-- ══════════════════════════════
       CIRCULAR LAWN (centre)
  ══════════════════════════════ -->
  <circle cx="350" cy="295" r="52" fill="#c8e6a0" stroke="#7ab050" stroke-width="2"/>
  <text x="350" y="290" text-anchor="middle" font-size="10" fill="#3a6020" font-weight="bold">Circular</text>
  <text x="350" y="305" text-anchor="middle" font-size="10" fill="#3a6020" font-weight="bold">Lawn</text>

  <!-- ══════════════════════════════
       WOODEN BRIDGE over stream
  ══════════════════════════════ -->
  <!-- Stream (narrow blue line) -->
  <line x1="460" y1="270" x2="460" y2="340" stroke="#7ab8d8" stroke-width="6"/>
  <!-- Bridge planks -->
  <rect x="454" y="296" width="12" height="22" fill="#c8a060" stroke="#8a6030" stroke-width="1.5" rx="1"/>
  <line x1="454" y1="302" x2="466" y2="302" stroke="#8a6030" stroke-width="1"/>
  <line x1="454" y1="308" x2="466" y2="308" stroke="#8a6030" stroke-width="1"/>
  <line x1="454" y1="314" x2="466" y2="314" stroke="#8a6030" stroke-width="1"/>
  <text x="474" y="312" font-size="8" fill="#5a4020" font-style="italic">bridge</text>

  <!-- ══════════════════════════════
       BUILDINGS
  ══════════════════════════════ -->

  <!-- RECEPTION BUILDING — south centre (Question 20 = F) -->
  <rect x="285" y="470" width="130" height="55" fill="#d8e8f8" stroke="#4a6888" stroke-width="2" rx="3"/>
  <text x="350" y="491" text-anchor="middle" font-size="11" fill="#2a4868" font-weight="bold">20</text>
  <circle cx="350" cy="491" r="13" fill="none" stroke="#2a4868" stroke-width="1.5"/>
  <text x="350" y="510" text-anchor="middle" font-size="9" fill="#555" font-style="italic">(label here)</text>
  <!-- Entrance arrow -->
  <text x="350" y="535" text-anchor="middle" font-size="10" fill="#4a6888">▲ ENTRANCE</text>

  <!-- EDUCATION CENTRE — right of circular lawn (Question 16 = C) -->
  <rect x="400" y="200" width="130" height="68" fill="#f0e8d0" stroke="#8a7040" stroke-width="2" rx="3"/>
  <text x="465" y="228" text-anchor="middle" font-size="11" fill="#5a4020" font-weight="bold">16</text>
  <circle cx="465" cy="228" r="13" fill="none" stroke="#5a4020" stroke-width="1.5"/>
  <text x="465" y="254" text-anchor="middle" font-size="9" fill="#555" font-style="italic">(label here)</text>

  <!-- PICNIC AREA — upper left path, before Bird Rehab (named, not numbered) -->
  <rect x="82" y="198" width="100" height="60" fill="#d8f0c0" stroke="#70a050" stroke-width="1.5" rx="3" stroke-dasharray="4,2"/>
  <text x="132" y="224" text-anchor="middle" font-size="10" fill="#3a6020" font-weight="bold">Picnic</text>
  <text x="132" y="240" text-anchor="middle" font-size="10" fill="#3a6020" font-weight="bold">Area</text>
  <!-- Picnic table symbol -->
  <line x1="115" y1="248" x2="149" y2="248" stroke="#70a050" stroke-width="1.5"/>
  <line x1="122" y1="245" x2="122" y2="255" stroke="#70a050" stroke-width="1.5"/>
  <line x1="142" y1="245" x2="142" y2="255" stroke="#70a050" stroke-width="1.5"/>

  <!-- BIRD REHABILITATION UNIT — north-west (Question 17 = A) -->
  <rect x="64" y="82" width="145" height="68" fill="#f8f0d8" stroke="#a08030" stroke-width="2" rx="3"/>
  <text x="137" y="112" text-anchor="middle" font-size="11" fill="#5a4010" font-weight="bold">17</text>
  <circle cx="137" cy="112" r="13" fill="none" stroke="#5a4010" stroke-width="1.5"/>
  <text x="137" y="138" text-anchor="middle" font-size="9" fill="#555" font-style="italic">(label here)</text>
  <!-- Bird icon -->
  <path d="M80 98 Q85 92 92 96 Q88 100 83 100Z" fill="#a08030" opacity="0.6"/>
  <path d="M88 94 Q94 88 100 92" fill="none" stroke="#a08030" stroke-width="1.2" opacity="0.6"/>

  <!-- VETERINARY CLINIC — east of bridge (Question 18 = G) -->
  <rect x="490" y="268" width="130" height="68" fill="#f8d8d8" stroke="#884848" stroke-width="2" rx="3"/>
  <text x="555" y="296" text-anchor="middle" font-size="11" fill="#5a2020" font-weight="bold">18</text>
  <circle cx="555" cy="296" r="13" fill="none" stroke="#5a2020" stroke-width="1.5"/>
  <text x="555" y="322" text-anchor="middle" font-size="9" fill="#555" font-style="italic">(label here)</text>
  <!-- Red cross symbol -->
  <line x1="595" y1="274" x2="595" y2="286" stroke="#cc3030" stroke-width="2.5"/>
  <line x1="589" y1="280" x2="601" y2="280" stroke="#cc3030" stroke-width="2.5"/>

  <!-- FOOD PREPARATION CENTRE — far east end (Question 19 = D) -->
  <rect x="490" y="370" width="130" height="68" fill="#e8f0d8" stroke="#507040" stroke-width="2" rx="3"/>
  <text x="555" y="398" text-anchor="middle" font-size="11" fill="#2a4820" font-weight="bold">19</text>
  <circle cx="555" cy="398" r="13" fill="none" stroke="#2a4820" stroke-width="1.5"/>
  <text x="555" y="424" text-anchor="middle" font-size="9" fill="#555" font-style="italic">(label here)</text>
  <!-- Path connecting Vet Clinic down to Food Prep -->
  <line x1="555" y1="336" x2="555" y2="370" stroke="#c8b880" stroke-width="8" stroke-linecap="round"/>

  <!-- ══════════════════════════════
       TREES / VEGETATION decoration
  ══════════════════════════════ -->
  <circle cx="80" cy="330" r="14" fill="#80c060" opacity="0.4"/>
  <circle cx="105" cy="315" r="10" fill="#70b050" opacity="0.4"/>
  <circle cx="620" cy="120" r="16" fill="#80c060" opacity="0.4"/>
  <circle cx="640" cy="140" r="11" fill="#70b050" opacity="0.4"/>
  <circle cx="610" cy="440" r="13" fill="#80c060" opacity="0.4"/>
  <circle cx="260" cy="120" r="12" fill="#80c060" opacity="0.4"/>
  <circle cx="240" cy="140" r="9" fill="#70b050" opacity="0.4"/>

  <!-- ══════════════════════════════
       NORTH DIRECTION ON MAIN PATH
  ══════════════════════════════ -->
  <text x="362" y="390" font-size="9" fill="#9a8a50" font-style="italic">↑ north</text>

  <!-- ══════════════════════════════
       SCALE + LEGEND
  ══════════════════════════════ -->
  <line x1="68" y1="516" x2="168" y2="516" stroke="#555" stroke-width="1.5"/>
  <line x1="68" y1="511" x2="68" y2="521" stroke="#555" stroke-width="1.5"/>
  <line x1="168" y1="511" x2="168" y2="521" stroke="#555" stroke-width="1.5"/>
  <text x="118" y="531" text-anchor="middle" font-size="10" fill="#555">20 metres</text>

  <text x="350" y="531" text-anchor="middle" font-size="10" fill="#888" font-style="italic">Not to scale – for reference only</text>

  <!-- Fence label -->
  <text x="56" y="58" font-size="9" fill="#5a7a4a" font-style="italic">--- perimeter fence</text>

</svg>
