<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" font-family="Arial, sans-serif" font-size="13">

  <!-- ── Background ── -->
  <rect width="720" height="540" fill="#f0f4ec" rx="6"/>

  <!-- ── Title ── -->
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">RIVERSIDE BOTANICAL GARDENS – SITE MAP</text>

  <!-- ── Outer boundary wall ── -->
  <rect x="55" y="40" width="600" height="460" fill="#d6ead0" stroke="#3a6a30" stroke-width="2.5" rx="4"/>

  <!-- ── Compass ── -->
  <polygon points="692,46 688,58 696,58" fill="#333"/>
  <line x1="692" y1="58" x2="692" y2="70" stroke="#333" stroke-width="1.5"/>
  <text x="692" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">N</text>

  <!-- ══════════════════════════════════════════════
       PATHS
  ══════════════════════════════════════════════ -->

  <!-- Central N–S path -->
  <rect x="338" y="40" width="38" height="460" fill="#f5eedd" opacity="0.85"/>
  <!-- E–W cross path -->
  <rect x="55" y="242" width="600" height="36" fill="#f5eedd" opacity="0.85"/>

  <!-- ══════════════════════════════════════════════
       FIXED / PRE-LABELLED FEATURES
       (These appear on the map with their names shown)
  ══════════════════════════════════════════════ -->

  <!-- Main Entrance – bottom centre (pre-labelled) -->
  <rect x="318" y="462" width="78" height="36" fill="#c8b88a" stroke="#7a6240" stroke-width="1.5" rx="3"/>
  <text x="357" y="477" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">MAIN</text>
  <text x="357" y="491" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">ENTRANCE</text>
  <!-- gate marks -->
  <line x1="318" y1="498" x2="318" y2="505" stroke="#7a6240" stroke-width="2"/>
  <line x1="396" y1="498" x2="396" y2="505" stroke="#7a6240" stroke-width="2"/>

  <!-- Café – top-right (pre-labelled, fixed on map) -->
  <rect x="490" y="55" width="140" height="80" fill="#fce8b0" stroke="#b08030" stroke-width="1.5" rx="3"/>
  <text x="560" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5010">Café</text>
  <!-- cup icon -->
  <text x="560" y="112" text-anchor="middle" font-size="16" fill="#b08030">☕</text>

  <!-- Greenhouse – top centre (pre-labelled) -->
  <rect x="250" y="55" width="82" height="58" fill="#c8f0c0" stroke="#3a8030" stroke-width="1" rx="3"/>
  <text x="291" y="80" text-anchor="middle" font-size="10" fill="#2a6020">Green-</text>
  <text x="291" y="94" text-anchor="middle" font-size="10" fill="#2a6020">house</text>

  <!-- Lake – centre -->
  <ellipse cx="357" cy="320" rx="62" ry="42" fill="#9ac8e8" stroke="#2860a0" stroke-width="1.5"/>
  <text x="357" y="324" text-anchor="middle" font-size="11" fill="#1a4880" font-weight="bold">Lake</text>

  <!-- ══════════════════════════════════════════════
       UNLABELLED FEATURES  (students must identify)
       Each has a question-number badge only.
  ══════════════════════════════════════════════ -->

  <!-- ── Q16 location: top-left  (answer = B Visitor Centre) ── -->
  <rect x="68" y="58" width="140" height="82" fill="#e8e8e8" stroke="#888" stroke-width="1.5" rx="3"/>
  <!-- number badge -->
  <circle cx="138" cy="99" r="14" fill="#1a3a6a" stroke="#fff" stroke-width="2"/>
  <text x="138" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">16</text>

  <!-- ── Q17 location: centre-left  (answer = D Rose Garden) ── -->
  <!-- Oval garden shape -->
  <ellipse cx="170" cy="263" rx="100" ry="68" fill="#e8e8e8" stroke="#888" stroke-width="1.5"/>
  <!-- decorative flower dots (neutral, no colour hint) -->
  <circle cx="140" cy="255" r="5" fill="#ccc"/>
  <circle cx="170" cy="248" r="5" fill="#ccc"/>
  <circle cx="200" cy="258" r="5" fill="#ccc"/>
  <circle cx="155" cy="275" r="5" fill="#ccc"/>
  <circle cx="185" cy="272" r="5" fill="#ccc"/>
  <!-- number badge -->
  <circle cx="170" cy="263" r="14" fill="#1a3a6a" stroke="#fff" stroke-width="2"/>
  <text x="170" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">17</text>

  <!-- ── Q18 location: centre-right  (answer = C Adventure Playground) ── -->
  <rect x="400" y="178" width="155" height="115" fill="#e8e8e8" stroke="#888" stroke-width="1.5" rx="5"/>
  <!-- neutral play symbol -->
  <line x1="420" y1="265" x2="540" y2="265" stroke="#aaa" stroke-width="1"/>
  <rect x="430" y="200" width="10" height="50" fill="#ccc" rx="2"/>
  <rect x="510" y="200" width="10" height="50" fill="#ccc" rx="2"/>
  <line x1="435" y1="205" x2="515" y2="205" stroke="#bbb" stroke-width="2"/>
  <!-- number badge -->
  <circle cx="478" cy="232" r="14" fill="#1a3a6a" stroke="#fff" stroke-width="2"/>
  <text x="478" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">18</text>

  <!-- ── Q19 location: bottom-right  (answer = E Boat House) ── -->
  <rect x="478" y="365" width="148" height="88" fill="#e8e8e8" stroke="#888" stroke-width="1.5" rx="3"/>
  <!-- neutral water/dock line -->
  <rect x="488" y="370" width="128" height="14" fill="#c0d8e8" rx="2"/>
  <line x1="545" y1="384" x2="545" y2="420" stroke="#aaa" stroke-width="1.5"/>
  <!-- number badge -->
  <circle cx="552" cy="418" r="14" fill="#1a3a6a" stroke="#fff" stroke-width="2"/>
  <text x="552" y="423" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">19</text>

  <!-- ── Q20 location: bottom-left  (answer = F Picnic Area) ── -->
  <rect x="68" y="362" width="155" height="92" fill="#e8e8e8" stroke="#888" stroke-width="1.5" rx="3"/>
  <!-- neutral table symbol -->
  <line x1="95" y1="400" x2="198" y2="400" stroke="#bbb" stroke-width="3"/>
  <line x1="108" y1="400" x2="108" y2="420" stroke="#bbb" stroke-width="2"/>
  <line x1="185" y1="400" x2="185" y2="420" stroke="#bbb" stroke-width="2"/>
  <line x1="95" y1="390" x2="198" y2="390" stroke="#bbb" stroke-width="1.5"/>
  <!-- number badge -->
  <circle cx="145" cy="415" r="14" fill="#1a3a6a" stroke="#fff" stroke-width="2"/>
  <text x="145" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">20</text>

  <!-- ══════════════════════════════════════════════
       DECORATIVE TREES
  ══════════════════════════════════════════════ -->
  <circle cx="90"  cy="195" r="13" fill="#5a9040" opacity="0.55"/>
  <circle cx="112" cy="178" r="9"  fill="#4a7830" opacity="0.5"/>
  <circle cx="620" cy="170" r="13" fill="#5a9040" opacity="0.55"/>
  <circle cx="598" cy="155" r="9"  fill="#4a7830" opacity="0.5"/>
  <circle cx="615" cy="355" r="13" fill="#5a9040" opacity="0.55"/>
  <circle cx="100" cy="320" r="11" fill="#5a9040" opacity="0.55"/>
  <circle cx="357" cy="135" r="9"  fill="#5a9040" opacity="0.45"/>
  <circle cx="260" cy="350" r="8"  fill="#5a9040" opacity="0.4"/>
  <circle cx="430" cy="140" r="8"  fill="#5a9040" opacity="0.4"/>

  <!-- ══════════════════════════════════════════════
       SCALE BAR
  ══════════════════════════════════════════════ -->
  <line x1="68"  y1="520" x2="168" y2="520" stroke="#555" stroke-width="1.5"/>
  <line x1="68"  y1="515" x2="68"  y2="525" stroke="#555" stroke-width="1.5"/>
  <line x1="168" y1="515" x2="168" y2="525" stroke="#555" stroke-width="1.5"/>
  <text x="118" y="535" text-anchor="middle" font-size="10" fill="#555">50 metres (approx.)</text>

  <text x="500" y="535" text-anchor="middle" font-size="10" fill="#999" font-style="italic">Not to scale</text>

</svg>
